<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설문 제작 및 발송 관리 시스템</title>
<!--
  첫 화면입니다.
  - Firestore의 surveys 컬렉션에서 설문 목록을 읽어 보여 줍니다(진행 중 / 마감 / 보관 구분, 검색, 20건씩 더 보기).
  - 설문을 누르면 상세(문항 미리 보기)가 열리고, "설문 응답하기"로 survey.html에 갑니다.
  - ?s=설문ID로 들어오면 그 설문의 상세만 보여 줍니다. 메일 링크(?t=토큰)는 survey.html로 넘깁니다.
  - 오른쪽 위 "관리자 모드"(admin.html). 설문 편집 페이지(editor.html)는 관리자 모드 안에서 갑니다.
-->
<style>
  :root { --c: #1f5fbf; --bg: #f4f6fa; --line: #dde3ec; --text: #222; --muted: #667; --ok: #1a9c4b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.6; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 60px; }
  .hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .hero h1 { font-size: 30px; margin: 0; color: var(--c); letter-spacing: -0.5px; }
  .hero p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  /* 화면 이동 링크 묶음(설문 안내 페이지·설문 편집 페이지·관리자 모드): 세 화면 공통, 옅은 보라색 바탕 */
  /* 다른 화면으로 가는 링크 묶음 — 옅은 보라 바탕 */
  .pagenav { display: inline-flex; gap: 4px; align-items: center; background: #efeafb; border: 1px solid #d5c9f2; border-radius: 10px; padding: 4px; flex-wrap: nowrap; white-space: nowrap; }
  .pagenav a, .pagenav button { color: #5b3fb0; font: inherit; font-size: 13px; text-decoration: none; border: 1px solid #b9a6e6; background: #fff; padding: 5px 8px; border-radius: 7px; white-space: nowrap; cursor: pointer; line-height: 1.4; }
  .pagenav a:hover, .pagenav button:hover { background: #e4dbf7; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar input, .toolbar select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; background: #fff; }
  .toolbar input { flex: 1; min-width: 200px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer; color: var(--muted); }
  .tabs button.on { background: var(--c); color: #fff; border-color: var(--c); }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row .t { font-weight: 600; font-size: 16px; color: var(--text); text-decoration: none; }
  .row .t:hover { color: var(--c); }
  .row .m { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .badge { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; vertical-align: middle; margin-right: 6px; }
  .b-open { background: #e3f6ea; color: var(--ok); } .b-closed { background: #eef0f4; color: var(--muted); }
  .btn { display: inline-block; padding: 9px 16px; border-radius: 8px; background: var(--c); color: #fff; font-weight: 600; text-decoration: none; font-size: 14px; white-space: nowrap; }
  .btn.sec { background: #fff; color: var(--c); border: 1px solid var(--c); }
  .btn.off { background: #c5ccd6; pointer-events: none; }
  .btn.big { padding: 13px 22px; font-size: 16px; border-radius: 10px; }
  .more { text-align: center; margin-top: 10px; }
  .empty { text-align: center; color: var(--muted); padding: 30px 0; }
  /* 상세 */
  .detail h2 { font-size: 24px; margin: 0 0 6px; color: var(--c); }
  .desc { color: var(--muted); margin: 0 0 6px; }
  .meta { font-size: 13px; color: var(--muted); }
  .notice { font-size: 13px; color: var(--muted); }
  .q { padding: 14px 0; border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: 0; padding-top: 0; }
  .q-title { font-weight: 600; margin: 0 0 6px; }
  .req { color: #d33; margin-left: 4px; }
  .opts { margin: 0; padding-left: 20px; color: #444; font-size: 14px; }
  .opts li { margin: 2px 0; }
  .tag { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-left: 6px; vertical-align: middle; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } .hero h1 { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <h1>설문 제작 및 발송 관리 시스템</h1>
      <p>설문을 만들고, 대상자에게 메일로 보내고, 응답과 통계를 한곳에서 관리합니다.</p>
    </div>
    <div class="pagenav"><a href="admin.html">관리자 모드</a></div>
  </div>
  <div id="app"><div class="card"><p class="meta">설문을 불러오는 중입니다…</p></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="survey-store.js"></script>
<script>
(async function () {
  if (new URLSearchParams(location.search).get('t')) { location.replace('survey.html' + location.search); return; }
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const app = document.getElementById('app');
  const typeName = { single: '객관식', multi: '체크박스', dropdown: '드롭다운', scale: '선형 배율', rating: '별점', short: '단답형', long: '장문형' };
  const PAGE = 20;

  const isClosed = sv => !!sv.forceClosed || (sv.closeAfterDeadline && sv.deadline && new Date() > new Date(sv.deadline + 'T23:59:59'));   // forceClosed: 관리 화면의 강제 마감
  // 상태: open(응답 가능) / closed(마감) / archived(보관)
  const stateOf = sv => sv.status === 'archived' ? 'archived' : isClosed(sv) ? 'closed' : 'open';
  const fmtDate = ms => ms ? new Date(ms).toLocaleDateString('ko-KR') : '';

  function questionsHtml(sv) {
    return sv.questions.map((q, i) => {
      let body = '';
      if (q.type === 'single' || q.type === 'multi' || q.type === 'dropdown') body = `<ul class="opts">${(q.options || []).map(o => `<li>${esc(o)}</li>`).join('')}${q.allowOther ? '<li>기타 (직접 입력)</li>' : ''}</ul>`;
      else if (q.type === 'scale') body = `<div class="opts" style="padding-left:0">${q.min ?? 1} ~ ${q.max ?? 5}점${q.labels && (q.labels[0] || q.labels[1]) ? ` (${esc(q.labels[0])} ~ ${esc(q.labels[1])})` : ''}</div>`;
      else if (q.type === 'rating') body = `<div class="opts" style="padding-left:0;color:#f5b301;font-size:18px">${(q.icon === 'heart' ? '♥' : q.icon === 'number' ? '' : '★').repeat(q.icon === 'number' ? 0 : (q.max ?? 5))}${q.icon === 'number' ? `1 ~ ${q.max ?? 5}` : ''}</div>`;
      else if (q.type === 'short') body = `<div class="opts" style="padding-left:0">짧은 글로 답변</div>`;
      else body = `<div class="opts" style="padding-left:0">자유롭게 작성</div>`;
      return `<div class="q"><p class="q-title">${i + 1}. ${esc(q.title)}${q.required ? '<span class="req">*</span>' : ''}<span class="tag">${typeName[q.type] || q.type}</span></p>${q.description ? `<p class="meta" style="margin:0 0 6px">${esc(q.description)}</p>` : ''}${body}</div>`;
    }).join('');
  }
  function answerButton(sv, big) {
    const st = stateOf(sv);
    if (st === 'archived') return `<span class="btn off${big ? ' big' : ''}">종료된 설문</span>`;
    if (st === 'closed') return `<span class="btn off${big ? ' big' : ''}">마감된 설문</span>`;
    if (sv.openEnabled === false) return `<span class="btn off${big ? ' big' : ''}">메일 링크로만 응답</span>`;
    return `<a class="btn${big ? ' big' : ''}" href="survey.html?s=${encodeURIComponent(sv.id)}">설문 응답하기</a>`;
  }
  function badge(sv) {
    const st = stateOf(sv);
    return st === 'open' ? '<span class="badge b-open">진행 중</span>' : st === 'closed' ? '<span class="badge b-closed">마감</span>' : '<span class="badge b-closed">보관</span>';
  }

  // 상세 화면 (설문 하나)
  function renderDetail(sv, backLink) {
    document.title = sv.title + ' — 설문 제작 및 발송 관리 시스템';
    const meta = [sv.deadline ? '응답 마감: ' + sv.deadline : '', '문항 수: ' + sv.questions.length + '개', sv.questions.some(q => q.required) ? '필수 문항 ' + sv.questions.filter(q => q.required).length + '개' : ''].filter(Boolean).join(' · ');
    const notice = sv.openEnabled === false ? '이 설문은 이메일로 발송된 개인 링크를 통해서만 응답할 수 있습니다.' : '메일로 개인 링크를 받으셨다면 그 링크로 응답해 주세요. 링크가 없는 분은 위 버튼을 눌러 이름과 소속을 적고 응답할 수 있습니다.';
    app.innerHTML = `
      ${backLink ? '<p style="margin:0 0 10px"><a href="index.html" style="display:inline-block;color:#c85a00;font-weight:700;font-size:14px;text-decoration:none;background:#fdebd9;border:1px solid #f0c9a4;border-radius:8px;padding:6px 12px">← 설문 목록으로</a></p>' : ''}
      <div class="card detail">
        <div>${badge(sv)}</div>
        <h2>${esc(sv.title)}</h2>
        <p class="desc">${esc(sv.description || '')}</p>
        <div class="meta">${meta}</div>
        <div style="margin-top:16px">${answerButton(sv, true)}</div>
        <p class="notice">${notice}</p>
      </div>
      <div class="card"><h3 style="margin:0 0 10px">설문 문항 미리 보기</h3>${questionsHtml(sv)}</div>`;
  }

  // 목록 화면
  let all = [], tab = 'open', keyword = '', shown = PAGE;
  function filtered() {
    const k = keyword.trim().toLowerCase();
    return all.filter(sv => (tab === 'all' || stateOf(sv) === tab) && (!k || (sv.title + ' ' + (sv.description || '')).toLowerCase().includes(k)));
  }
  function renderList() {
    document.title = '설문 제작 및 발송 관리 시스템';
    const counts = { open: 0, closed: 0, archived: 0 }; all.forEach(sv => counts[stateOf(sv)]++);
    const list = filtered(), page = list.slice(0, shown);
    app.innerHTML = `
      <div class="card">
        <div class="toolbar">
          <div class="tabs">
            <button data-tab="open"${tab === 'open' ? ' class="on"' : ''}>진행 중 ${counts.open}</button>
            <button data-tab="closed"${tab === 'closed' ? ' class="on"' : ''}>마감 ${counts.closed}</button>
            <button data-tab="archived"${tab === 'archived' ? ' class="on"' : ''}>보관 ${counts.archived}</button>
            <button data-tab="all"${tab === 'all' ? ' class="on"' : ''}>전체 ${all.length}</button>
          </div>
          <input type="search" id="kw" placeholder="설문 제목 검색" value="${esc(keyword)}">
          <span class="count" id="cnt">${list.length}건</span>
        </div>
        <div id="rows">${rowsHtml(page)}</div>
        <div id="moreWrap">${moreHtml(list)}</div>
      </div>`;
    app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; shown = PAGE; renderList(); });
    // 검색 입력은 다시 그리지 않고 목록만 갱신 (입력 칸을 새로 만들면 한글 조합 중인 글자가 깨짐)
    document.getElementById('kw').oninput = e => { keyword = e.target.value; shown = PAGE; renderRows(); };
    bindMore();
  }
  function rowsHtml(page) {
    return page.map(sv => `<div class="row">
              <div>
                <a class="t" href="index.html?s=${encodeURIComponent(sv.id)}">${esc(sv.title || '(제목 없음)')}</a>
                <div class="m">${badge(sv)}${sv.deadline ? '마감 ' + esc(sv.deadline) + ' · ' : ''}${sv.questions.length}문항${sv.createdAtMs ? ' · 만든 날 ' + fmtDate(sv.createdAtMs) : ''}${sv.openEnabled === false ? ' · 메일 링크 전용' : ''}</div>
              </div>
              <div>${answerButton(sv, false)} <a class="btn sec" href="index.html?s=${encodeURIComponent(sv.id)}">문항 보기</a></div>
            </div>`).join('') || `<div class="empty">${all.length ? '조건에 맞는 설문이 없습니다.' : '아직 설문이 없습니다. 설문 편집 페이지에서 설문을 만들면 이곳에 표시됩니다.'}</div>`;
  }
  function moreHtml(list) { return list.length > shown ? `<div class="more"><button class="btn sec" id="moreBtn">더 보기 (${list.length - shown}건 남음)</button></div>` : ''; }
  function bindMore() { const more = document.getElementById('moreBtn'); if (more) more.onclick = () => { shown += PAGE; renderRows(); }; }
  function renderRows() {
    const list = filtered();
    document.getElementById('rows').innerHTML = rowsHtml(list.slice(0, shown));
    document.getElementById('cnt').textContent = `${list.length}건`;
    document.getElementById('moreWrap').innerHTML = moreHtml(list); bindMore();
  }

  try {
    if (!firebaseConfigured() || !window.firebase) throw new Error('Firebase가 설정되지 않았습니다.');
    firebase.initializeApp(FIREBASE_CONFIG);
    const store = SurveyStore.init(firebase.firestore());
    const only = new URLSearchParams(location.search).get('s');
    if (only) {
      const sv = await store.get(only);
      if (!sv) throw new Error('설문을 찾을 수 없습니다.');
      renderDetail(sv, true); return;
    }
    all = await store.list(true);   // 보관 포함, 최근 만든 순
    const open = all.filter(sv => stateOf(sv) === 'open');
    if (all.length === 1 && open.length === 1) { renderDetail(open[0], false); return; }  // 설문이 하나뿐이면 바로 상세
    if (!open.length && all.length) tab = 'all';
    renderList();
  } catch (err) {
    console.error(err);
    app.innerHTML = `<div class="card"><h2 style="margin:0 0 6px">설문을 불러오지 못했습니다</h2><p class="meta">${esc(err.message)}</p></div>`;
  }
})();
</script>
</body>
</html>
