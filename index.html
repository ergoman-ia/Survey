<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설문조사 안내</title>
<!--
  설문 안내 페이지(저장소 첫 화면)입니다.
  - survey-config.js의 제목·설명·문항을 읽어 설문 내용을 미리 보여 줍니다.
  - "설문 응답하기"를 누르면 survey.html로 이동해 응답할 수 있습니다(공개 응답, openEnabled가 true일 때).
  - 메일 링크(?t=토큰)로 이 페이지에 들어오면 자동으로 survey.html로 넘깁니다.
  - 오른쪽 위 "관리자 모드"로 admin.html에 들어갑니다.
-->
<style>
  :root { --c: #1f5fbf; --bg: #f4f6fa; --line: #dde3ec; --text: #222; --muted: #667; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; line-height: 1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .top a { color: var(--muted); font-size: 13px; text-decoration: none; border: 1px solid var(--line); background: #fff; padding: 6px 12px; border-radius: 8px; }
  .top a:hover { color: var(--c); border-color: var(--c); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 22px; margin-bottom: 16px; }
  h1 { font-size: 24px; margin: 0 0 8px; color: var(--c); }
  .desc { color: var(--muted); margin: 0 0 6px; }
  .meta { font-size: 13px; color: var(--muted); }
  .btn { display: inline-block; padding: 13px 22px; border-radius: 10px; background: var(--c); color: #fff; font-weight: 600; text-decoration: none; font-size: 16px; }
  .btn.off { background: #9ab; pointer-events: none; }
  .q { padding: 14px 0; border-top: 1px solid var(--line); }
  .q:first-of-type { border-top: 0; padding-top: 0; }
  .q-title { font-weight: 600; margin: 0 0 6px; }
  .req { color: #d33; margin-left: 4px; }
  .opts { margin: 0; padding-left: 20px; color: #444; font-size: 14px; }
  .opts li { margin: 2px 0; }
  .tag { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-left: 6px; vertical-align: middle; }
  .notice { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="meta">설문조사 안내</span>
    <a href="admin.html">관리자 모드</a>
  </div>

  <div class="card">
    <h1 id="title">설문조사</h1>
    <p class="desc" id="desc"></p>
    <div class="meta" id="meta"></div>
    <div style="margin-top:16px">
      <a class="btn" id="startBtn" href="survey.html">설문 응답하기</a>
    </div>
    <p class="notice" id="notice"></p>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px">설문 문항 미리 보기</h3>
    <div id="questions"></div>
  </div>
</div>

<script src="survey-config.js"></script>
<script>
(function () {
  // 메일 링크(?t=토큰)로 들어온 경우 바로 설문 화면으로
  if (new URLSearchParams(location.search).get('t')) { location.replace('survey.html' + location.search); return; }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  document.title = SURVEY.title + ' — 안내';
  document.getElementById('title').textContent = SURVEY.title;
  document.getElementById('desc').textContent = SURVEY.description || '';
  const metaParts = [];
  if (SURVEY.deadline) metaParts.push('응답 마감: ' + SURVEY.deadline);
  metaParts.push('문항 수: ' + SURVEY.questions.length + '개');
  const req = SURVEY.questions.filter(q => q.required).length;
  if (req) metaParts.push('필수 문항 ' + req + '개');
  document.getElementById('meta').textContent = metaParts.join(' · ');

  // 마감·공개 여부에 따라 버튼 상태 결정
  const btn = document.getElementById('startBtn'), notice = document.getElementById('notice');
  const closed = SURVEY.closeAfterDeadline && SURVEY.deadline && new Date() > new Date(SURVEY.deadline + 'T23:59:59');
  if (closed) { btn.classList.add('off'); btn.textContent = '설문이 마감되었습니다'; }
  else if (SURVEY.openEnabled === false) { btn.classList.add('off'); btn.textContent = '메일로 받은 링크에서만 응답할 수 있습니다'; notice.textContent = '이 설문은 이메일로 발송된 개인 링크를 통해서만 응답할 수 있습니다. 아래는 문항 미리 보기입니다.'; }
  else notice.textContent = '메일로 개인 링크를 받으셨다면 그 링크로 응답해 주세요. 링크가 없는 분은 위 버튼을 눌러 이름과 소속을 적고 응답할 수 있습니다.';

  const typeName = { single: '하나 선택', multi: '여러 개 선택', scale: '점수', text: '주관식' };
  document.getElementById('questions').innerHTML = SURVEY.questions.map((q, i) => {
    let body = '';
    if (q.type === 'single' || q.type === 'multi') body = `<ul class="opts">${q.options.map(o => `<li>${esc(o)}</li>`).join('')}</ul>`;
    else if (q.type === 'scale') body = `<div class="opts" style="padding-left:0">${q.min ?? 1} ~ ${q.max ?? 5}점${q.labels ? ` (${esc(q.labels[0])} ~ ${esc(q.labels[1])})` : ''}</div>`;
    else body = `<div class="opts" style="padding-left:0">자유롭게 작성</div>`;
    return `<div class="q"><p class="q-title">${i + 1}. ${esc(q.title)}${q.required ? '<span class="req">*</span>' : ''}<span class="tag">${typeName[q.type] || q.type}</span></p>${body}</div>`;
  }).join('');
})();
</script>
</body>
</html>
